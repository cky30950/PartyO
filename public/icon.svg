<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 16-bit Tavern Wood & Gold Crest -->
  <rect width="16" height="16" fill="#3B2314"/>
  <rect x="1" y="1" width="14" height="14" fill="#6E4226"/>
  <rect x="2" y="2" width="12" height="12" fill="#8C5633"/>
  <!-- Gold Corner Studs -->
  <rect x="2" y="2" width="1" height="1" fill="#F7C948"/>
  <rect x="13" y="2" width="1" height="1" fill="#F7C948"/>
  <rect x="2" y="13" width="1" height="1" fill="#F7C948"/>
  <rect x="13" y="13" width="1" height="1" fill="#F7C948"/>
  <!-- Pixel Tavern Mug & Foam -->
  <rect x="4" y="4" width="6" height="2" fill="#FFFDF5"/>
  <rect x="5" y="3" width="4" height="1" fill="#FFFDF5"/>
  <rect x="4" y="6" width="6" height="6" fill="#F5B82E"/>
  <rect x="5" y="6" width="2" height="5" fill="#FCE07A"/>
  <rect x="4" y="12" width="6" height="1" fill="#C97E18"/>
  <!-- Mug Handle -->
  <rect x="10" y="7" width="2" height="1" fill="#FFFDF5"/>
  <rect x="11" y="8" width="1" height="2" fill="#FFFDF5"/>
  <rect x="10" y="10" width="2" height="1" fill="#FFFDF5"/>
  <!-- Sparkle -->
  <rect x="11" y="4" width="1" height="1" fill="#FFE88A"/>
  <rect x="3" y="9" width="1" height="1" fill="#FFE88A"/>
</svg>
